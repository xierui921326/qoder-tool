<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qoder账号管理器</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
    <div id="app">
        <!-- 标题栏 -->
        <div class="title-bar">
            <div class="title-bar-left">
                <img src="icon.svg" alt="Logo" class="app-icon">
                <span class="app-title">Qoder账号管理器</span>
            </div>
            <div class="title-bar-right">
                <button class="title-bar-button" id="minimize-btn" title="最小化">
                    <svg width="12" height="12" viewBox="0 0 12 12">
                        <rect x="0" y="5" width="12" height="2"/>
                    </svg>
                </button>
                <button class="title-bar-button" id="maximize-btn" title="最大化">
                    <svg width="12" height="12" viewBox="0 0 12 12">
                        <rect x="0" y="0" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1"/>
                    </svg>
                </button>
                <button class="title-bar-button close" id="close-btn" title="关闭">
                    <svg width="12" height="12" viewBox="0 0 12 12">
                        <path d="M0,0 L12,12 M12,0 L0,12" stroke="currentColor" stroke-width="1"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 主要内容区域 -->
        <div class="main-content">
            <!-- 侧边栏 -->
            <div class="sidebar">
                <nav class="nav-menu">
                    <a href="#dashboard" class="nav-item active" data-page="dashboard">
                        <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20">
                            <rect x="2" y="2" width="7" height="7" rx="1"/>
                            <rect x="11" y="2" width="7" height="7" rx="1"/>
                            <rect x="2" y="11" width="7" height="7" rx="1"/>
                            <rect x="11" y="11" width="7" height="7" rx="1"/>
                        </svg>
                        <span>仪表板</span>
                    </a>
                    <a href="#register" class="nav-item" data-page="register">
                        <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20">
                            <path d="M10 2L3 7v11h4v-6h6v6h4V7l-7-5z"/>
                        </svg>
                        <span>账号注册</span>
                    </a>
                    <a href="#accounts" class="nav-item" data-page="accounts">
                        <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20">
                            <circle cx="10" cy="7" r="4"/>
                            <path d="M3 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/>
                        </svg>
                        <span>账号管理</span>
                    </a>
                    <a href="#config" class="nav-item" data-page="config">
                        <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20">
                            <circle cx="10" cy="10" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                        <span>配置</span>
                    </a>
                    <a href="#logs" class="nav-item" data-page="logs">
                        <svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>
                            <polyline points="10,9 9,9 8,9"/>
                            <polyline points="12,13 11,13 10,13 9,13"/>
                        </svg>
                        <span>日志</span>
                    </a>
                </nav>
            </div>

            <!-- 内容区域 -->
            <div class="content-area">
                <!-- 仪表板页面 -->
                <div id="dashboard-page" class="page active">
                    <div class="page-header">
                        <h1>仪表板</h1>
                        <p>欢迎使用Qoder账号管理器</p>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24">
                                    <circle cx="12" cy="12" r="10"/>
                                    <polyline points="12,6 12,12 16,14"/>
                                </svg>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number" id="total-accounts">0</div>
                                <div class="stat-label">总账号数</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon success">
                                <svg width="24" height="24" viewBox="0 0 24 24">
                                    <polyline points="20,6 9,17 4,12"/>
                                </svg>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number" id="success-accounts">0</div>
                                <div class="stat-label">成功注册</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon error">
                                <svg width="24" height="24" viewBox="0 0 24 24">
                                    <circle cx="12" cy="12" r="10"/>
                                    <line x1="15" y1="9" x2="9" y2="15"/>
                                    <line x1="9" y1="9" x2="15" y2="15"/>
                                </svg>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number" id="failed-accounts">0</div>
                                <div class="stat-label">注册失败</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon warning">
                                <svg width="24" height="24" viewBox="0 0 24 24">
                                    <circle cx="12" cy="12" r="10"/>
                                    <line x1="12" y1="8" x2="12" y2="12"/>
                                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                                </svg>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number" id="pending-accounts">0</div>
                                <div class="stat-label">待处理</div>
                            </div>
                        </div>
                    </div>
                    <div class="recent-activity">
                        <h2>最近活动</h2>
                        <div id="activity-list" class="activity-list">
                            <div class="activity-item">
                                <div class="activity-icon">
                                    <svg width="16" height="16" viewBox="0 0 16 16">
                                        <circle cx="8" cy="8" r="6"/>
                                    </svg>
                                </div>
                                <div class="activity-content">
                                    <div class="activity-title">应用启动</div>
                                    <div class="activity-time">刚刚</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 其他页面将通过JavaScript动态加载 -->
                <div id="register-page" class="page">
                    <div class="page-header">
                        <h1>账号注册</h1>
                        <p>注册新的Qoder账号</p>
                    </div>
                    <div class="form-container">
                        <form id="register-form" class="register-form">
                            <div class="form-group">
                                <label for="email">邮箱地址</label>
                                <input type="email" id="email" name="email" required>
                            </div>
                            <div class="form-group">
                                <label for="password">密码</label>
                                <input type="password" id="password" name="password" required>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">开始注册</button>
                                <button type="button" class="btn btn-secondary" id="batch-register-btn">批量注册</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div id="accounts-page" class="page">
                    <div class="page-header">
                        <h1>账号管理</h1>
                        <p>管理已注册的账号</p>
                    </div>
                    <div id="accounts-table-container">
                        <!-- 账号表格将通过JavaScript动态生成 -->
                    </div>
                </div>

                <div id="config-page" class="page">
                    <div class="page-header">
                        <h1>配置</h1>
                        <p>配置邮件和自动化设置</p>
                    </div>
                    <div class="config-container">
                        <!-- 配置表单将通过JavaScript动态生成 -->
                    </div>
                </div>

                <div id="logs-page" class="page">
                    <div class="page-header">
                        <h1>日志</h1>
                        <p>查看系统运行日志</p>
                    </div>
                    <div id="logs-container">
                        <!-- 日志内容将通过JavaScript动态加载 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 状态栏 -->
        <div class="status-bar">
            <div class="status-left">
                <span id="status-text">就绪</span>
            </div>
            <div class="status-right">
                <span id="version-text">v1.0.0</span>
            </div>
        </div>
    </div>

    <!-- 加载指示器 -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <div class="loading-text">处理中...</div>
        </div>
    </div>

    <!-- 通知容器 -->
    <div id="notifications" class="notifications-container"></div>

    <script src="js/app.js"></script>
</body>
</html>
